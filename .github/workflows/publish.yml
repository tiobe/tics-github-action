name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Upload sbom to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/cyclonedx/bom.json
